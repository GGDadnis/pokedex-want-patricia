<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex — Lista</title>
<style>
  :root{
    --bg: #131418;
    --panel: #1b1d24;
    --line: #2b2e38;
    --red: #e63b3b;
    --red-dim: #7a2323;
    --text: #eceef2;
    --text-dim: #8b8f9c;
    --gold: #f2c14e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% 0%, #1e2027 0%, var(--bg) 55%);
    color:var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    padding: 40px 20px 80px;
  }
  header{
    max-width: 980px;
    margin: 0 auto 36px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  .ball{
    width:46px;height:46px;border-radius:50%;
    background: linear-gradient(var(--red) 0 48%, #14151a 48% 52%, #fff 52% 100%);
    border:3px solid #14151a;
    box-shadow: 0 0 0 3px #2b2e38;
    position:relative;
    flex-shrink:0;
  }
  .ball::after{
    content:"";
    position:absolute; top:50%; left:50%;
    width:14px; height:14px; border-radius:50%;
    background:#14151a; border:3px solid #fff;
    transform:translate(-50%,-50%);
  }
  h1{
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin:0;
  }
  h1 span{ color: var(--red); }
  .sub{
    color:var(--text-dim);
    font-size:0.8rem;
    margin-top:4px;
  }
  .grid{
    max-width: 980px;
    margin: 0 auto;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap:10px;
  }
  .entry{
    position:relative;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 14px;
    display:flex;
    align-items:baseline;
    gap:12px;
    cursor:default;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .entry:hover{
    border-color: var(--red);
    background:#20222b;
    transform: translateY(-1px);
  }
  .num{
    color: var(--gold);
    font-size:0.82rem;
    flex-shrink:0;
    min-width:38px;
  }
  .name{
    font-size:0.92rem;
    letter-spacing:0.01em;
  }
  .preview{
    position:absolute;
    left:50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(6px) scale(0.96);
    width:180px;
    background: var(--panel);
    border:1px solid var(--red);
    border-radius:8px;
    padding:10px;
    opacity:0;
    pointer-events:none;
    transition: opacity .12s ease, transform .12s ease;
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align:center;
  }
  .entry:hover .preview{
    opacity:1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  .preview img{
    width:100%;
    height:150px;
    object-fit:contain;
    image-rendering:auto;
    display:block;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
  }
  .preview .cap{
    margin-top:6px;
    font-size:0.72rem;
    color: var(--text-dim);
    letter-spacing:0.05em;
  }
  .preview::after{
    content:"";
    position:absolute;
    top:100%; left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color: var(--red);
  }
  footer{
    max-width:980px;
    margin: 40px auto 0;
    color:var(--text-dim);
    font-size:0.72rem;
    text-align:center;
    line-height:1.6;
  }
  footer a{ color: var(--gold); }

  .export-btn{
    margin-left:auto;
    background: var(--panel);
    border:1px solid var(--red);
    color: var(--text);
    font-family: inherit;
    font-size:0.78rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .export-btn:hover{
    background: var(--red);
    color:#14151a;
  }
  @media (max-width: 560px){
    header{ flex-wrap:wrap; }
    .export-btn{ margin-left:0; order:3; width:100%; text-align:center; }
  }
</style>
</head>
<body>

<header>
  <div class="ball"></div>
  <div>
    <h1>Poké<span>dex</span> — Wantlist da Patricia</h1>
    <div class="sub">Passe o mouse sobre um nome pra ver a imagem - Me ajude a completar a coleção!</div>
  </div>
  <button class="export-btn" id="exportBtn">Exportar .txt</button>
</header>

<div class="grid" id="grid"></div>

<footer>
  imagens: official artwork via <a href="https://github.com/PokeAPI/sprites" target="_blank">PokeAPI/sprites</a> (GitHub) &middot; dados: <a href="https://pokeapi.co" target="_blank">pokeapi.co</a>
</footer>

<script>

["1006","Iron Valiant"],["1010","Iron Leaves"],["1019","Hydrapple"],["1021","Raging Bolt"],["1022","Iron Boulder"]
];

const grid = document.getElementById('grid');
const frag = document.createDocumentFragment();

pokemons.forEach(([num, name]) => {
  const idNum = parseInt(num, 10);
  const imgUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${idNum}.png`;

  const el = document.createElement('div');
  el.className = 'entry';
  el.innerHTML = `
    <span class="num">#${num}</span>
    <span class="name">${name}</span>
    <div class="preview">
      <img src="${imgUrl}" alt="${name}" loading="lazy">
      <div class="cap">Nº ${num}</div>
    </div>
  `;
  frag.appendChild(el);
});

grid.appendChild(frag);

document.getElementById('exportBtn').addEventListener('click', () => {
  const lines = pokemons.map(([num, name]) => `#${num}  ${name}`);
  const content = lines.join('\n') + '\n';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pokedex.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
